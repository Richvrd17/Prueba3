{% extends 'base.html' %}
{% block contenido %}
<h1>{% if object %}Editar{% else %}Nuevo{% endif %} Videojuego</h1>
<form method="post" class="mt-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
