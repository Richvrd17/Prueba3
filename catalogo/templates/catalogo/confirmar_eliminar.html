{% extends 'base.html' %}
{% block contenido %}
<h1>¿Eliminar "{{ object.titulo }}"?</h1>
<p>Esta acción no se puede deshacer.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'lista' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
